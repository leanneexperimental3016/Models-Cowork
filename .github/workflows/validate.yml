name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run router tests
        run: python -m unittest discover -s core/tests -v
      - name: Parse registry and schemas
        run: |
          python -m json.tool core/model-registry.json > /dev/null
          python -m json.tool core/handoff.schema.json > /dev/null
          python -m json.tool core/ledger.schema.json > /dev/null
      - name: Check pack entrypoints
        run: |
          test -f packs/codex/model-cowork/.codex-plugin/plugin.json
          test -f packs/claude/model-cowork/.claude-plugin/plugin.json
          test -f packs/copilot/model-cowork/.github/skills/model-cowork/SKILL.md
          test -f packs/antigravity/model-cowork/plugin.json
          test -f packs/ollama/model-cowork/model_cowork.py

